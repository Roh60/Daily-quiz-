name: Verify and build GK Swal

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify-android:
    name: Android compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js for Functions syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Android and Firebase configuration
        run: python tools/validate_project_config.py
      - name: Report release readiness blockers
        run: python tools/audit_release_readiness.py
      - name: Audit local GK question bank
        run: python tools/audit_question_bank.py
      - name: Audit fact-check tracker covers every shipped question
        run: python tools/audit_question_factcheck_tracker.py
      - name: Validate Cloud Functions JavaScript and JSON configuration
        run: |
          node --check functions/index.js
          node --check firestore.test.js
          node --check functions.integration.test.js
          python - <<'PYJSON'
          import json
          for path in ("firebase.json", "functions/package.json", "app/google-services.json"):
              with open(path, encoding="utf-8") as source:
                  json.load(source)
              print(f"Valid JSON: {path}")
          PYJSON
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "platforms;android-36-ext1" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile and run unit tests
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload installable debug APK for phone testing
        uses: actions/upload-artifact@v4
        with:
          name: gk-swal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  verify-firestore:
    name: Firestore security rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Firebase test tools
        run: npm install --no-save firebase-tools firebase @firebase/rules-unit-testing firebase-admin
      - name: Install Cloud Functions dependencies
        run: npm --prefix functions install
      - name: Run Firestore rules tests in emulator
        run: npx firebase emulators:exec --only auth,firestore,functions --project demo-no-project --config firebase.json "FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 node --test firestore.test.js functions.integration.test.js"

  release:
    name: Build signed Android App Bundle
    # Enable only after legal pages are completed and signing secrets are set.
    if: ${{ vars.ENABLE_SIGNED_RELEASE == 'true' }}
    needs: [verify-android, verify-firestore]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "platforms;android-36-ext1" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Block signed release while legal pages or AdMob setup are incomplete
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PUBLIC_PRIVACY_POLICY_URL: ${{ vars.PUBLIC_PRIVACY_POLICY_URL }}
          PUBLIC_ACCOUNT_DELETION_URL: ${{ vars.PUBLIC_ACCOUNT_DELETION_URL }}
        run: python tools/audit_release_readiness.py --strict
      - name: Decode upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "Missing GitHub Actions secret UPLOAD_KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
          test -s "$GITHUB_WORKSPACE/my-upload-key.jks"
      - name: Build signed release bundle
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
          PUBLIC_PRIVACY_POLICY_URL: ${{ vars.PUBLIC_PRIVACY_POLICY_URL }}
          PUBLIC_ACCOUNT_DELETION_URL: ${{ vars.PUBLIC_ACCOUNT_DELETION_URL }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || (echo "Missing STORE_PASSWORD secret" >&2; exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing KEY_PASSWORD secret" >&2; exit 1)
          gradle --no-daemon bundleRelease
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: gk-swal-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
